<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro-Burst</title>
    <base href="/" />
    <script>
        // Set the theme before first paint to avoid a flash of the wrong theme.
        (function () {
            try {
                const stored = localStorage.getItem('microburst-theme');
                const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-bs-theme', stored || system);
            } catch { document.documentElement.setAttribute('data-bs-theme', 'light'); }
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MicroExercise.Client.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="container py-5 text-secondary">Loading…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/hotkeys.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
